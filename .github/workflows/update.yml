name: Daily Market Data Update

on:
  schedule:
    - cron: '0 10 * * *'   # 한국 19:00 (미장 개장 전)
    - cron: '0 13 * * *'   # 한국 22:00 (미장 중반)
    - cron: '0 16 * * *'   # 한국 01:00 (미장 후반)
    - cron: '0 18 * * *'   # 한국 03:00 (미장 마감 직후)
    - cron: '0 1 * * *'    # 한국 10:00 (전날 마감 정리)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data fetcher
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators.json
          git diff --cached --quiet || git commit -m "chore: daily indicator update $(date -u +'%Y-%m-%d')"
          git push
